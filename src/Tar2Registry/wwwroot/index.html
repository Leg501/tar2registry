<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>tar2registry — реестр образов</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel-2:#21262d;
  --accent:#238636; --accent-hover:#2ea043; --accent-text:#fff;
  --btn-gray:#21262d; --btn-gray-hover:#30363d;
  --text:#e6edf3; --text-2:#9198a1; --text-3:#6e7681;
  --line:#30363d; --line-soft:#21262d;
  --blue:#58a6ff; --red:#f85149; --green:#3fb950; --warn:#d29922;
  --radius:6px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:24px 16px 48px}
.hidden{display:none}

header{display:flex;align-items:center;gap:10px;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:20px;flex-wrap:wrap}
.octo{width:28px;height:28px;fill:var(--text);flex-shrink:0}
h1{font-size:18px;font-weight:600;margin:0}
.host{color:var(--text-2);font-size:13px}
.spacer{flex:1}
.link{color:var(--text-2);font-size:13px;text-decoration:none;padding:5px 10px;border:1px solid var(--line);border-radius:var(--radius)}
.link:hover{color:var(--text);background:var(--panel-2)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.card-header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card-header h2{font-size:14px;font-weight:600;margin:0;flex:1}
.badge{font-size:11px;padding:1px 8px;border:1px solid var(--line);border-radius:10px;color:var(--text-2)}
.card-body{padding:16px}
section{margin-bottom:16px}

.search{width:100%;padding:6px 12px;border-radius:var(--radius);border:1px solid var(--line);
  background:var(--bg);color:var(--text);font-size:14px;margin-bottom:12px}
.search::placeholder{color:var(--text-3)}
.search:focus{outline:2px solid var(--blue);outline-offset:-1px}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--text-2);padding:8px 16px;border-bottom:1px solid var(--line)}
td{padding:12px 16px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .1s}
tbody tr:hover{background:#131920}
.repo{font-weight:600;color:var(--blue);white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;padding:0 8px;border-radius:20px;background:var(--panel-2);border:1px solid var(--line);
  color:var(--text);font-size:12px;font-variant-numeric:tabular-nums;line-height:20px;transition:border-color .1s;cursor:pointer}
.tag:hover{border-color:var(--blue)}
.tag .del{background:none;border:none;color:var(--text-3);cursor:pointer;font-size:13px;line-height:1;
  padding:0 0 0 5px;margin:0}
.tag .del:hover{color:var(--red)}
.copy{background:var(--btn-gray);border:1px solid var(--line);color:var(--text);font-size:12px;
  font-weight:500;cursor:pointer;padding:4px 10px;border-radius:var(--radius)}
.copy:hover{background:var(--btn-gray-hover);border-color:var(--line-strong,#8b949e)}

#msg{margin:0 0 16px}
.msg{padding:10px 14px;border-radius:var(--radius);font-size:13px;display:flex;gap:8px;align-items:center;border:1px solid}
.msg.ok{background:rgba(63,185,80,.1);color:var(--green);border-color:rgba(63,185,80,.4)}
.msg.error{background:rgba(248,81,73,.1);color:var(--red);border-color:rgba(248,81,73,.4)}
.msg.info{background:rgba(88,166,255,.1);color:var(--blue);border-color:rgba(88,166,255,.4)}

.card-header.upload{background:var(--panel-2)}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 4px}
label:first-of-type{margin-top:0}
.hint{font-size:12px;color:var(--text-3);font-weight:400;margin-left:6px}
input[type=text]{width:100%;padding:6px 12px;border-radius:var(--radius);border:1px solid var(--line);
  background:var(--bg);color:var(--text);font-size:14px}
input[type=text]:focus{outline:2px solid var(--blue);outline-offset:-1px}
input[type=file]{color:var(--text-2);width:100%;font-size:13px}
input[type=file]::file-selector-button{background:var(--btn-gray);color:var(--text);border:1px solid var(--line);
  border-radius:var(--radius);padding:5px 12px;margin-right:12px;cursor:pointer;font-size:13px;font-weight:500}
input[type=file]::file-selector-button:hover{background:var(--btn-gray-hover)}
.found{font-size:12px;color:var(--text-2);margin:8px 0}
.found code{background:var(--panel-2);border-radius:6px;padding:2px 6px;color:var(--text)}
/* путь реестра: адрес хоста показан отдельной «прибитой» частью поля */
.hostwrap{display:flex;align-items:stretch}
.hostwrap .hostprefix{display:flex;align-items:center;padding:6px 10px;background:var(--panel-2);
  border:1px solid var(--line);border-right:none;border-radius:var(--radius) 0 0 var(--radius);
  color:var(--text-2);font-size:13px;white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.hostwrap input[type=text]{border-radius:0 var(--radius) var(--radius) 0}
/* блоки формы: файл / путь / метки — отдельные «карточки» внутри формы */
.fgroup{border:1px solid var(--line);border-radius:var(--radius);padding:12px 12px 14px;
  margin-bottom:12px;background:var(--panel-2)}
.fgroup label{margin:0 0 6px}
/* место под чипы архива зарезервировано — форма не «скачет» при появлении меток */
.foundwrap{min-height:34px;margin:0 0 12px}
.foundwrap .foundlabel{font-size:12px;color:var(--text-3)}
.foundwrap .foundlabel.ready{color:var(--text-2)}
/* ввод меток чипами */
.chipbox{display:flex;flex-wrap:wrap;gap:6px;padding:5px 6px;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--bg)}
.chipbox:focus-within{outline:2px solid var(--blue);outline-offset:-1px}
.chipbox input{display:none;flex:1;min-width:80px;border:none;padding:2px 6px;font-size:14px;background:transparent}
.chipbox input:focus{outline:none}
.chipbox input.open{display:inline-block}
.chip{display:inline-flex;align-items:center;gap:4px;padding:0 8px;border-radius:20px;
  background:var(--panel-2);border:1px solid var(--line);font-size:12px;line-height:20px}
.chip .del{background:none;border:none;color:var(--text-3);cursor:pointer;font-size:13px;line-height:1;padding:0}
.chip .del:hover{color:var(--red)}
.chip.addown{cursor:pointer;color:var(--text-2);border-style:dashed;background:none}
.chip.addown:hover{color:var(--text);border-color:var(--blue)}
/* найденные в архиве метки — чипы-подсказки */
.foundchips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.foundchips .tag{cursor:pointer;font-size:12px}
.foundchips .tag::before{content:"+";color:var(--green);font-weight:600;margin-right:4px}
.foundchips .tag.active{opacity:.4;pointer-events:none}
.btn{margin-top:16px;padding:7px 16px;border:none;border-radius:var(--radius);background:var(--accent);
  color:var(--accent-text);font-size:14px;font-weight:500;cursor:pointer}
.btn:hover{background:var(--accent-hover)}
.btn:disabled{opacity:.6;cursor:default}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--accent-text);
  border-top-color:transparent;border-radius:50%;animation:r 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes r{to{transform:rotate(360deg)}}
.progress{height:4px;background:var(--panel-2);border-radius:2px;margin-top:12px;overflow:hidden}
.progress>div{height:100%;width:0;background:var(--accent);transition:width .2s}

@media (max-width:640px){th:nth-child(3),td:nth-child(3){display:none}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}tbody tr{transition:none}.progress>div{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="octo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-label="tar2registry">
      <path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z"/>
      <path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/>
      <path d="M7.75 5.25 16.25 9.75"/>
    </svg>
    <h1>tar2registry</h1>
    <span class="host" id="host"></span>
    <span class="spacer"></span>
    <a class="link" href="/logout">Выйти</a>
  </header>

  <div id="msg"></div>

  <section class="card">
    <div class="card-header">
      <h2>Репозитории</h2>
      <span class="badge" id="count"></span>
    </div>
    <div class="card-body">
      <input type="text" class="search" id="filter" placeholder="Фильтр: имя репозитория или метка, например 2026.11">
      <table>
        <thead><tr><th>Репозиторий</th><th>Метки</th><th>Pull</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <div class="card-header upload">
      <h2>Загрузить образ из tar</h2>
    </div>
    <div class="card-body">
      <form id="upl">
        <div class="fgroup">
          <label for="file">Файл tar</label>
          <input type="file" id="file" accept=".tar,.tar.gz,.tgz" required>
        </div>
        <p class="foundwrap" id="foundwrap">
          <span class="foundlabel" id="foundlabel">Метки в архиве — появятся после чтения архива</span>
          <span class="foundchips" id="foundchips"></span>
        </p>
        <div class="fgroup">
          <label for="repo">Путь в реестре <span class="hint">без адреса и метки; разделитель папок — «/», не «-»</span></label>
          <div class="hostwrap"><span class="hostprefix" id="hostprefix">реестр/</span><input type="text" id="repo" placeholder="monitor-proektov/backend" required></div>
          <label style="margin-top:12px">Метки <span class="hint">через Enter или запятую; например latest и 2026.ММ.ДД-коммит</span></label>
          <div class="chipbox" id="chipbox"><button type="button" class="chip addown" id="addown" title="Ввести свою метку">+ своя метка</button><input type="text" id="taginput"></div>
        </div>
        <input type="hidden" id="tag">
        <button type="submit" class="btn" id="btn">Загрузить</button>
        <div class="progress hidden" id="prog"><div id="progbar"></div></div>
      </form>
    </div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const msg = (t, cls) => $('msg').innerHTML = `<div class="msg ${cls}">${t}</div>`;
let enableDelete = false;
let registryHost = '';

// clipboard API недоступен на http вне localhost — запасной путь
async function copyText(t) {
  if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(t); return; }
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  document.execCommand('copy'); ta.remove();
}

async function copyPull(repo, tag) {
  const cmd = `docker pull ${registryHost}/${repo}${tag ? ':' + tag : ''}`;
  try { await copyText(cmd); msg('Скопировано: <code>' + esc(cmd) + '</code>', 'ok'); }
  catch (e) { msg('Не удалось скопировать: ' + esc(e.message || e), 'error'); }
}

// POST с прогрессом отправки (fetch его не умеет)
function xhrPost(url, fd, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', url);
    xhr.upload.onprogress = e => { if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total); };
    xhr.onload = () => {
      try { resolve(JSON.parse(xhr.responseText)); }
      catch { reject(new Error('HTTP ' + xhr.status)); }
    };
    xhr.onerror = () => reject(new Error('ошибка сети'));
    xhr.send(fd);
  });
}

async function loadCatalog() {
  try {
    const r = await fetch('/api/catalog');
    if (!r.ok) { msg('Реестр недоступен (код ' + r.status + ')', 'error'); return; }
    const j = await r.json();
    enableDelete = !!j.enableDelete;
    registryHost = j.registryHost;
    $('host').textContent = j.registryHost;
    $('count').textContent = j.repos.length;
    const tb = $('tbody');
    tb.innerHTML = '';
    if (!j.repos.length) {
      tb.innerHTML = '<tr><td colspan="3" style="color:var(--text-3)">Реестр пуст — загрузите первый tar ниже</td></tr>';
      return;
    }
    for (const repo of j.repos) {
      const tr = document.createElement('tr');
      tr.dataset.search = (repo.name + ' ' + (repo.tags || []).join(' ')).toLowerCase();
      const tags = (repo.tags || []).map(t => {
        const del = enableDelete
          ? `<button class="del" data-repo="${esc(repo.name)}" data-tag="${esc(t)}" title="Удалить метку">×</button>`
          : '';
        return `<span class="tag" data-repo="${esc(repo.name)}" data-tag="${esc(t)}" title="Скопировать docker pull">${esc(t)}${del}</span>`;
      }).join('');
      tr.innerHTML = `<td class="repo">${esc(repo.name)}</td><td><div class="tags">${tags || '<span style="color:var(--text-3)">нет меток</span>'}</div></td>`
        + `<td><button class="copy" data-repo="${esc(repo.name)}" title="Скопировать docker pull (latest)">copy pull</button></td>`;
      tb.appendChild(tr);
    }
    tb.querySelectorAll('.copy').forEach(b => b.onclick = () => copyPull(b.dataset.repo, ''));
    tb.querySelectorAll('.tag').forEach(el => el.onclick = () => copyPull(el.dataset.repo, el.dataset.tag));
    tb.querySelectorAll('.del').forEach(b => b.onclick = ev => { ev.stopPropagation(); deleteTag(b.dataset.repo, b.dataset.tag); });
    applyFilter();
  } catch (e) { msg('Не удалось опросить реестр: ' + esc(e.message || e), 'error'); }
}

async function deleteTag(repo, tag) {
  if (!confirm(`Удалить метку «${tag}» у ${repo}?\nМанифест будет помечен удалённым; место освободит только сборка мусора реестра.`)) return;
  const fd = new FormData();
  fd.append('repo', repo); fd.append('tag', tag);
  try {
    const r = await fetch('/api/delete', { method: 'POST', body: fd });
    const j = await r.json();
    if (j.ok) { msg(esc(j.message), 'ok'); loadCatalog(); }
    else msg(esc(j.error || 'ошибка удаления'), 'error');
  } catch (e) { msg('Ошибка сети: ' + esc(e.message || e), 'error'); }
}

$('filter').addEventListener('input', applyFilter);
function applyFilter() {
  const q = $('filter').value.toLowerCase();
  document.querySelectorAll('#tbody tr').forEach(tr =>
    tr.style.display = (tr.dataset.search || '').includes(q) ? '' : 'none');
}

$('file').addEventListener('change', async () => {
  const f = $('file').files[0];
  $('foundchips').innerHTML = '';
  $('foundlabel').textContent = 'Читаю архив…';
  $('foundlabel').classList.remove('ready');
  if (!f) return;
  // на время чтения архива закрыть выбор файла и кнопку загрузки
  $('file').disabled = true; $('btn').disabled = true;
  const fd = new FormData();
  fd.append('file', f);
  msg('Читаю архив… <span id="inspct"></span>', 'info');
  try {
    const j = await xhrPost('/api/inspect', fd, p => {
      const el = $('inspct'); if (el) el.textContent = Math.round(p * 100) + '%';
    });
    if (j.error) { msg(esc(j.error), 'error'); return; }
    $('msg').innerHTML = '';
    const fc = $('foundchips'); fc.innerHTML = '';
    if (j.repoTags && j.repoTags.length) {
      for (const rt of j.repoTags) {
        const [name, ...tag] = rt.split(':');
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'tag';
        b.title = 'Добавить в метки: ' + rt;
        b.textContent = rt;
        b.onclick = () => {
          if (!$('repo').value) $('repo').value = name;
          addTag(tag.length ? tag.join(':') : 'latest');
          b.classList.add('active');
        };
        fc.appendChild(b);
      }
      // путь всегда берём из архива — так разделитель точно «/», а не «-»
      const [firstName] = j.repoTags[0].split(':');
      $('repo').value = firstName;
      $('foundlabel').textContent = 'Метки в архиве — нажмите, чтобы добавить:';
      $('foundlabel').classList.add('ready');
      $('foundwrap').classList.remove('hidden');
    } else {
      $('foundlabel').textContent = 'Метки в архиве не найдены — укажите путь и метки ниже вручную';
      $('foundlabel').classList.add('ready');
    }
  } catch (e) {
    $('foundlabel').textContent = 'Не удалось прочитать архив: ' + (e.message || e);
    msg('Не удалось прочитать архив: ' + esc(e.message || e), 'error');
  } finally {
    $('file').disabled = false; $('btn').disabled = false;
  }
});

// ——— метки чипами ———
let selectedTags = [];
const tagRxJs = /^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$/;

function renderTags() {
  const box = $('chipbox');
  box.querySelectorAll('.chip:not(.addown)').forEach(el => el.remove());
  for (const t of selectedTags) {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.innerHTML = `<span>${esc(t)}</span><button type="button" class="del" title="Убрать метку">×</button>`;
    chip.querySelector('.del').onclick = () => {
      selectedTags = selectedTags.filter(x => x !== t);
      renderTags();
      syncFoundChips();
    };
    box.appendChild(chip);
  }
  // «+ своя метка» держим сразу после последнего чипа, поле ввода — в конце
  box.appendChild($('addown'));
  box.appendChild($('taginput'));
  $('tag').value = selectedTags.join(',');
}

function addTag(t) {
  t = t.trim().replace(/^:+|:+$/g, '');
  if (!t || !tagRxJs.test(t)) return false;
  if (!selectedTags.includes(t)) { selectedTags.push(t); renderTags(); }
  syncFoundChips();
  return true;
}

function syncFoundChips() {
  document.querySelectorAll('#foundchips .tag').forEach(b => {
    const rt = b.textContent;
    const t = rt.includes(':') ? rt.split(':')[1] : rt;
    b.classList.toggle('active', selectedTags.includes(t));
  });
}

$('taginput').addEventListener('keydown', ev => {
  if (ev.key === 'Enter' || ev.key === ',') {
    ev.preventDefault();
    if (addTag($('taginput').value)) { $('taginput').value = ''; $('taginput').classList.remove('open'); }
  } else if (ev.key === 'Backspace' && !$('taginput').value && selectedTags.length) {
    selectedTags.pop(); renderTags();
  } else if (ev.key === 'Escape') {
    $('taginput').value = ''; $('taginput').classList.remove('open');
  }
});
$('taginput').addEventListener('blur', () => {
  addTag($('taginput').value); $('taginput').value = ''; $('taginput').classList.remove('open');
});
$('addown').addEventListener('click', () => { $('taginput').classList.add('open'); $('taginput').focus(); });

$('upl').addEventListener('submit', async ev => {
  ev.preventDefault();
  // страховка: путь без «/» при найденном из архива пути со «/» — поправить (типичная ошибка «-» вместо «/»)
  const firstFound = $('foundchips').firstElementChild;
  if (firstFound && firstFound.textContent.includes(':')) {
    const nameFromArchive = firstFound.textContent.split(':')[0];
    if ($('repo').value && !$('repo').value.includes('/') && nameFromArchive.includes('/')) {
      $('repo').value = nameFromArchive;
      msg('Путь в реестре поправлен на путь из архива: <code>' + esc(nameFromArchive) + '</code>', 'info');
    }
  }
  const btn = $('btn'), prog = $('prog'), bar = $('progbar');
  // незавершённый ввод в поле метки — добавить перед отправкой
  addTag($('taginput').value); $('taginput').value = '';
  btn.disabled = true;
  $('file').disabled = true; // пока идёт загрузка, файл менять нельзя
  btn.innerHTML = '<span class="spinner"></span>Загружаю… 0%';
  prog.classList.remove('hidden'); bar.style.width = '0%';
  const fd = new FormData();
  fd.append('file', $('file').files[0]);
  fd.append('repo', $('repo').value);
  fd.append('tag', $('tag').value);
  try {
    const j = await xhrPost('/api/upload', fd, p => {
      bar.style.width = Math.round(p * 100) + '%';
      btn.innerHTML = p < 1
        ? `<span class="spinner"></span>Загружаю… ${Math.round(p * 100)}%`
        : '<span class="spinner"></span>Пушу в реестр…';
    });
    if (j.ok) { msg('Загружено: ' + esc(j.message), 'ok'); loadCatalog(); }
    else msg(esc(j.error || 'неизвестная ошибка'), 'error');
  } catch (e) { msg('Ошибка сети: ' + esc(e.message || e), 'error'); }
  btn.disabled = false; btn.textContent = 'Загрузить';
  $('file').disabled = false;
  prog.classList.add('hidden');
});

loadCatalog();
</script>
</body>
</html>
